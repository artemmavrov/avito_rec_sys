# Hyper-parameters of the whole pipeline (training and inference share this file).
# Values were selected on the validation hold-out (see README, "Validation").

seed: 42

# --- train cleaning (data/clean_train.py) ---
cleaning:
  cap_pairs_per_query: 16          # flattens the tail: one query has 6.5k pairs

# --- hold-outs (data/split.py) ---
split:
  n_validation_queries: 2500       # val: measurement only
  n_ranker_queries: 8000           # separate hold-out on which the CatBoost ranker is trained
  seen_fraction: 0.385             # share of hold-out queries whose text also occurs in train (benchmark: 945/2452)

# --- text truncation, in tokens ---
text:
  query_max_tokens: 48
  item_max_tokens: 128

# --- lexical tour: BM25 per field over lemmas, summed with these weights ---
bm25:
  field_weights: {title: 1.0, params: 0.5, desc: 1.0}

# --- weighted reciprocal-rank fusion of the tours ---
rrf:
  k: 200                           # large k: the goal is recall inside 50 slots, not precision at the very top
  weights: {bm25f: 2.0, dense: 4.0, sparse: 0.0}   # tuned on val for the fine-tuned encoder

# --- candidate pool ---
pool:
  retrieval_k: 1000                # depth of every tour's global ranking
  size: 600                        # candidates per query that reach the ranker
  output_k: 50                     # answer size
  # local / global / "global within near_radius_km of the query location" rankings are merged by
  # reciprocal rank (retrieval/pool.py)
  merge: {rrf_k: 60, near_radius_km: 100, near_weight: 1.0}
  query_chunk: 512                 # queries per feature-building chunk (bounds RAM; keep a multiple of 256)

# --- layer freezing for bi-encoder fine-tuning ---
freezing:
  freeze_embeddings: true
  frozen_layers: 6                 # of 24 transformer layers

# --- bi-encoder fine-tuning (FlagEmbedding M3 trainer: dense + sparse + ColBERT, self-distillation) ---
biencoder_train:
  temperature: 0.05
  lr: 1.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-6
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  precision: "bf16"
  gradient_checkpointing: true
  batch_size_groups: 256           # one group = query + positive + hard negatives
  epochs: 2
  checkpoint_every_steps: 200
  hard_negatives_per_positive: 2
  negative_rank_min: 10            # negatives are sampled from ranks [min, max) of the mining ranking
  negative_rank_max: 200
  # Epoch 2 is a separate run started from the epoch-1 weights (negatives are re-mined in between),
  # so it uses a gentler schedule.
  epoch2:
    lr: 5.0e-6
    warmup_ratio: 0.01

# --- CatBoost ranker ---
catboost:
  loss_function: "YetiRank"
  iterations: 600                  # fixed: early stopping on a few hundred queries is too noisy
  learning_rate: 0.05
  depth: 8
  train_queries: 8000
