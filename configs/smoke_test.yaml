# Overrides applied on top of pipeline.yaml for LOCAL GPU smoke tests only
# (RTX 3050, 4 GB VRAM). Purpose: exercise the training code paths (shapes,
# freezing, checkpointing, optimizer step) on a tiny synthetic subset before
# renting the real 3090. Not meant to produce meaningful model quality.

text:
  query_max_tokens: 32
  item_max_tokens: 64
  cross_encoder_max_tokens: 96

freezing:
  freeze_embeddings: true
  frozen_layers: 22   # unfreeze only the last 2 of 24 layers to fit 4 GB

biencoder_train:
  batch_size_groups: 2
  docs_per_group: 3
  epochs: 1
  max_steps: 4
  checkpoint_every_steps: 2
  hard_negatives_per_positive: 1
  gradient_checkpointing: true

reranker_train:
  batch_size_pairs: 4
  negatives_per_positive: 2
  epochs: 1
  max_steps: 4
  checkpoint_every_steps: 2
  gradient_checkpointing: true

pool_sizes:
  retrieval_k: 50
  colbert_k: 20
  reranker_k: 20
  output_k: 10

smoke:
  n_synthetic_queries: 30
  n_synthetic_items: 200
  cpu_fallback_on_oom: true
