[project]
name = "avito-rec-sys"
version = "1.0.0"
description = "Candidate generation for Avito service search: bge-m3 + BM25 tours, CatBoost ranker"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["avito_rec_sys*"]
